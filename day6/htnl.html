<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Light Mode</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background-color:#f4f6f9;
    color:#333;
    font-family:Arial, sans-serif;
    transition:0.4s;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:500px;
    text-align:center;
    padding:30px;
    border-radius:10px;
    background:white;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.dark{
    background:#121212;
    color:white;
}

.dark .container{
    background:#1e1e1e;
}

h1{
    margin-bottom:20px;
}

p{
    margin-top:20px;
    line-height:1.6;
}

button{
    margin-top:15px;
    padding:10px 25px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    background:#4CAF50;
    color:white;
    transition:0.3s;
}

button:hover{
    background:#3b9440;
}

footer{
    margin-top:25px;
    font-size:14px;
    color:gray;
}

</style>

</head>

<body>

<div class="container">

<h1>About Us</h1>

<button id="mode-btn">Dark Mode</button>

<p>
Lorem ipsum dolor sit amet consectetur adipisicing elit. Quae, nihil. 
Minima aut optio vel nam recusandae. Quis nesciunt repellat ducimus 
incidunt error, est rerum sapiente, aliquid culpa officia expedita 
nisi dolores.
</p>

<footer>
<h3>hello thank you for coming</h3>
</footer>

</div>

<script>

const button = document.getElementById("mode-btn");

button.addEventListener("click", function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        button.innerText = "Light Mode";
    } else {
        button.innerText = "Dark Mode";
    }

});

</script>

</body>
</html>
