<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Light Mode</title>

<style>
body{
    background-color: white;
    color: black;
    font-family: Arial, sans-serif;
    transition: 0.3s;
}

.dark{
    background-color: black;
    color: white;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>

<body>

<h1 id="heading-id">hello</h1>

<button id="mode-btn">Dark Mode</button>

<p>
Lorem ipsum dolor sit amet, consectetur adipisicing elit. Illum cum dolore voluptates quibusdam vero!
</p>

<script>

const heading = document.getElementById("heading-id");
const button = document.getElementById("mode-btn");

heading.innerText = "bhavya";

button.addEventListener("click", function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        button.innerText = "Light Mode";
    } else {
        button.innerText = "Dark Mode";
    }

});

</script>

</body>
</html>
