<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
   
    <title>AI Fake News Detector</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 70%;
            height: 140px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: #ff5722;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #e64a19;
        }

        .meter {
            width: 70%;
            height: 25px;
            background: #ddd;
            margin: 20px auto;
            border-radius: 20px;
            overflow: hidden;
        }

        #scoreBar {
            height: 100%;
            width: 0%;
            background: green;
            transition: 0.5s;
        }

        #scoreText {
            font-weight: bold;
            margin-bottom: 15px;
        }

        #result {
            width: 70%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>📰 AI Fake News Detector</h1>

    <textarea id="newsInput" placeholder="Paste news headline or article here..."></textarea>

    <br>

    <button onclick="analyzeNews()">Analyze News</button>

    <div class="meter">
        <div id="scoreBar"></div>
    </div>

    <div id="scoreText"></div>

    <div id="result"></div>

    <script>



        async function analyzeNews() {

            const news = document.getElementById("newsInput").value
const prompt = `
Analyze the following news text and determine if it might be fake or misleading.

News:
${news}

Provide output in this format:

Score: number between 0-100 (credibility score where lower means more likely fake)

Bias:
Identify possible political, commercial, or ideological bias.

Explanation:
Explain why the news might be credible or misleading.

Fact-check suggestions:
Suggest ways the user can verify the information.

Verified sources:
List reliable sources (news agencies, research organizations, fact-check websites).

YouTube references:
Provide 3 relevant YouTube videos that explain or discuss this news topic.
Include:
- Video title
- Channel name
- YouTube search link or video link
`;

            const response = await fetch(
                https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${},
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [{ text: prompt }]
                            }
                        ]
                    })
                }
            )

            const data = await response.json()

            const text = data.candidates[0].content.parts[0].text

            document.getElementById("result").innerText = text

            const match = text.match(/\d+/)

            if (match) {

                const score = parseInt(match[0])

                document.getElementById("scoreBar").style.width = score + "%"

                document.getElementById("scoreText").innerText = "Credibility Score: " + score + "/100"

                if (score < 40)
                    document.getElementById("scoreBar").style.background = "red"

                else if (score < 70)
                    document.getElementById("scoreBar").style.background = "orange"

                else
                    document.getElementById("scoreBar").style.background = "green"

            }

        }

    </script>

</body>

</html>
